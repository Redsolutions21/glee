<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GLEE management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F7F7F7;--card:#FFFFFF;--ink:#4A4A4A;--mute:#7B7B7B;--line:#E6E6E6;--accent:#C8FF3D;--accent-ink:#3A3A3A;--ok:#5FA80F;--ok-soft:#C8FF3D;--head-bg:#FFFFFF;--head-ink:#4A4A4A;--plan-bg:#F7F7F7;--r:8px;--display:'Cairo',system-ui,sans-serif;--serif:'Fraunces',Georgia,serif;--body:'Cairo',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--head-bg);color:var(--head-ink);position:sticky;top:0;z-index:20}
header.top img{height:34px}
header.top h1{font-family:var(--display);font-size:22px;margin:0;flex:1;letter-spacing:.01em}
header.top .count{font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;white-space:nowrap}
header.top .who{font-size:13px;opacity:.85}
.navbar{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:19;scrollbar-width:none}
.navbar::-webkit-scrollbar{display:none}
.navbar button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.navbar button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--card);min-height:42px}
.btn.accent{background:var(--accent);color:var(--accent-ink)} .btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor} .btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.danger{background:transparent;color:#B42318;border:1.5px solid #B42318}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:4px 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:start}
.kpi .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--mute)}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .kpi.hl .l{color:inherit;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-family:var(--display);font-size:18px;margin:0 0 4px}
.sub{font-size:13px;color:var(--mute);margin:0 0 12px}
.muted{color:var(--mute)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.st-Lead{background:#EEF0F2;color:#3D4650}.st-Lead i{background:#8A949E}
.st-Contacted{background:#E6F0FF;color:#1D4ED8}.st-Contacted i{background:#3B82F6}
.st-Follow-up{background:#FFF4E0;color:#9A5B00}.st-Follow-up i{background:#F59E0B}
.st-Signing{background:#F3E8FF;color:#6B21A8}.st-Signing i{background:#9333EA}
.st-Confirmed{background:#E3F8EA;color:#116B34}.st-Confirmed i{background:#16A34A}
.st-Not\ joining{background:#F4F4F4;color:#7A7A7A;text-decoration:line-through}.st-Not\ joining i{background:#BDBDBD}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:start}
.item:hover{border-color:var(--ink)}
.item b{font-size:15.5px}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden}.prog span{display:block;height:100%;background:var(--ok)}
.due{color:#B42318;font-weight:700}
.feed{display:flex;flex-direction:column;gap:10px}
.feed .u{border-inline-start:3px solid var(--accent);padding:2px 0 2px 10px}
.feed .u .m{font-size:12px;color:var(--mute)}
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;margin-bottom:10px;background:var(--card)}
/* floor plan */
.plan{width:100%;height:auto;display:block;background:var(--plan-bg);border-radius:var(--r)}
.plan .lab{font:700 22px var(--body);letter-spacing:.08em;fill:var(--ink)} .plan .sm{font:600 18px var(--body);fill:var(--mute)} .plan .hall{font:800 26px var(--display);letter-spacing:.12em;fill:var(--mute);opacity:.55}
.plan .bth{cursor:pointer} .plan .bth:hover rect.b{stroke-width:5}
.plan .bn{font:800 28px var(--display);fill:var(--ink)} .plan .bv{font:700 19px var(--body);fill:var(--ink)} .plan .bs{font:600 15px var(--body);fill:var(--ink);opacity:.6}
.planwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
@media (max-width:700px){.plan{min-width:760px}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink);display:inline-block}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100%);background:var(--bg);z-index:41;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.open .scrim{display:block}.open .drawer{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.drawer .dh h2{font-family:var(--display);margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .db{overflow:auto;padding:16px;flex:1}
.drawer .df{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin:12px 0 4px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--card)}
textarea.in{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stages button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;min-height:36px}
.stages button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ck input{width:22px;height:22px;accent-color:var(--ok)} .ck span{flex:1}.ck.done span{text-decoration:line-through;color:var(--mute)}
.ck button{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px}
.login{max-width:400px;margin:10vh auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px}
.login h1{font-family:var(--display);margin:12px 0 4px}
.err{color:#B42318;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);opacity:0;pointer-events:none;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-weight:700;transition:transform .2s;z-index:60}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.empty{padding:22px;text-align:center;color:var(--mute)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.s4,.s6,.s8{grid-column:span 12}header.top{position:static;padding:10px 16px}header.top h1{font-size:19px}.navbar{top:0}}
@media (max-width:420px){.two{grid-template-columns:1fr}header.top .who{display:none}}
</style>
</head>

/* ---------- auth ---------- */
function loginView(msg){
  app.innerHTML=`<form class="login" id="lf"><img src="${LOGO}" alt="glee" style="height:40px"><h1>Team sign in</h1><p class="muted small">GLEE management page. Team members only.</p>
  <label class="f" for="em">Email</label><input class="in" id="em" type="email" autocomplete="username" required>
  <label class="f" for="pw">Password</label><input class="in" id="pw" type="password" autocomplete="current-password" required>
  <div style="height:14px"></div><button class="btn" style="width:100%">Sign in</button>
  <p class="small"><a href="#" id="fp">Forgot or setting your password?</a></p><p class="err" id="le">${esc(msg||'')}</p></form>`;
  document.getElementById('lf').onsubmit=async e=>{e.preventDefault();document.getElementById('le').textContent='';
    const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    if(error){document.getElementById('le').textContent=error.message;return} start()};
  document.getElementById('fp').onclick=async e=>{e.preventDefault();const v=em.value.trim();if(!v){document.getElementById('le').textContent='Type your email first.';return}
    const {error}=await sb.auth.resetPasswordForEmail(v,{redirectTo:location.href.split('#')[0]});document.getElementById('le').textContent=error?error.message:'Check your email for a link to set your password.'};
}
async function setPasswordView(){
  app.innerHTML=`<form class="login" id="pf"><img src="${LOGO}" alt="glee" style="height:40px"><h1>Set your password</h1>
  <label class="f" for="np">New password (8+ characters)</label><input class="in" id="np" type="password" minlength="8" autocomplete="new-password" required>
  <div style="height:14px"></div><button class="btn" style="width:100%">Save password</button><p class="err" id="pe"></p></form>`;
  document.getElementById('pf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:np.value});
    if(error){pe.textContent=error.message;return} history.replaceState(null,'',location.pathname);toast('Password saved');start()};
}
async function start(){
  const {data:{session}}=await sb.auth.getSession(); if(!session) return loginView();
  ME.email=session.user.email;
  const {data:adm}=await sb.from('admins').select('user_id').eq('user_id',session.user.id);
  if(!adm||!adm.length){await sb.auth.signOut();return loginView('This account is not on the GLEE team yet. Ask Ebrahim to add you.')}
  await loadAll(); live();
}
async function loadAll(){
  const [t,i,u]=await Promise.all([sb.from('team').select('*'),sb.from('mg_items').select('*').order('name'),sb.from('mg_updates').select('*').order('created_at',{ascending:false}).limit(300)]);
  if(i.error){app.innerHTML=`<div class="wrap"><div class="card"><h2>Setup needed</h2><p class="muted">${esc(i.error.message)}</p><p>Run <b>glee-manage-setup.sql</b> in Supabase first.</p></div></div>`;return}
  TEAM=t.data||[]; ITEMS=i.data||[]; UPD=u.data||[];
  ME.name=(TEAM.find(x=>x.email.toLowerCase()===ME.email.toLowerCase())||{}).name||ME.email.split('@')[0];
  render();
}
function live(){ if(chan) return; let tm=null; const re=()=>{clearTimeout(tm);tm=setTimeout(async()=>{const open=document.body.classList.contains('open');await loadAll();if(open&&CUR)openItem(CUR.id,true)},400)};
  chan=sb.channel('mg').on('postgres_changes',{event:'*',schema:'public',table:'mg_items'},re).on('postgres_changes',{event:'*',schema:'public',table:'mg_updates'},re).subscribe(); }

const by=k=>ITEMS.filter(i=>i.kind===k);
const boothOf=b=>ITEMS.find(i=>i.kind==='vendor'&&i.booth===b&&i.stage!=='Not joining');

function listMini(L,showDate){ if(!L.length) return `<p class="empty">Nothing here.</p>`;

function feed(L){ if(!L.length) return `<p class="empty">No updates yet. Open any item and add one.</p>`;

/* ---------- floor plan ---------- */
const FILL={Confirmed:'var(--ok-soft)',Signing:'#E9D5FF','Follow-up':'#FDE7B8',Contacted:'#DBEAFE',Lead:'#E5E7EB'};
function planSVG(){
  const s=GEO.size,h=s/2;
  const booths=GEO.booths.map(([x,y,f],n)=>{const id='B'+String(n+1).padStart(2,'0');const it=boothOf(id);
    const fill=it?(FILL[it.stage]||'#fff'):'#FFFFFF';const dash=it&&it.setup==='Own booth'?'stroke-dasharray="12 8"':'';
    const name=it?it.name:'Free'; const words=name.split(' '); let l1='',l2='';
    for(const w of words){ if(!l2&&(l1+' '+w).trim().length<=10) l1=(l1+' '+w).trim(); else l2=(l2+' '+w).trim() }
    if(!l1){l1=name.slice(0,10);l2=name.slice(10)} if(l2.length>11) l2=l2.slice(0,10)+'…';
    return `<g class="bth" data-b="${id}"><rect class="b" x="${x-h}" y="${y-h}" width="${s}" height="${s}" rx="8" fill="${fill}" stroke="var(--ink)" stroke-width="3" ${dash}/>
     <text x="${x}" y="${y-20}" text-anchor="middle" class="bn">${id}</text><text x="${x}" y="${y+8}" text-anchor="middle" class="bv">${esc(l1)}</text>
     ${l2?`<text x="${x}" y="${y+30}" text-anchor="middle" class="bv">${esc(l2)}</text>`:''}${it?'':`<text x="${x}" y="${y+30}" text-anchor="middle" class="bs">tap to assign</text>`}</g>`}).join('');
  return `<div class="planwrap"><svg class="plan" viewBox="0 0 ${GEO.W} ${GEO.H}" role="img" aria-label="Floor plan with 16 booths">${PLAN_SVG}${booths}</svg></div>`;
}
function vPlan(M){
  const free=GEO.booths.map((_,n)=>'B'+String(n+1).padStart(2,'0')).filter(b=>!boothOf(b));
  M.innerHTML=`<div class="grid"><section class="card s8"><h2>Floor plan · Andalous Mall</h2><p class="sub">Swipe sideways on a phone to see the whole plan. Tap a booth to open its vendor, or assign one to a free booth. Changes show here and in the visitor app once a vendor is Confirmed.</p>
   ${planSVG()}<div class="legend"><span><i style="background:#fff"></i>Free</span>${['Lead','Contacted','Follow-up','Signing','Confirmed'].map(s=>`<span><i style="background:${FILL[s]}"></i>${s}</span>`).join('')}<span><i style="background:#fff;border-style:dashed"></i>Own booth</span></div></section>
   <section class="card s4"><h2>Booths</h2><p class="sub">${16-free.length} assigned · ${free.length} free</p>
   <div class="feed">${GEO.booths.map((_,n)=>{const id='B'+String(n+1).padStart(2,'0'),it=boothOf(id);return `<div class="row" data-b="${id}" style="cursor:pointer;border-bottom:1px solid var(--line);padding:7px 0"><b style="width:44px">${id}</b><span class="grow">${it?esc(it.name):'<span class="muted">Free</span>'}<span class="small muted">${it&&it.setup?' · '+esc(it.setup):''}</span></span>${it?pill(it.stage):''}</div>`}).join('')}</div></section></div>`;

function boothClick(b){const it=boothOf(b); if(it) return openItem(it.id); assignBooth(b)}
function assignBooth(b){
  const cand=by('vendor').filter(v=>!v.booth&&v.stage!=='Not joining').sort((a,c)=>STAGES.indexOf(c.stage)-STAGES.indexOf(a.stage)||a.name.localeCompare(c.name));
  drawer(`Assign ${b}`,`<p class="muted small">Pick a vendor from your list, or add a new one.</p>
   <label class="f" for="av">Vendor</label><select class="in" id="av"><option value="">Choose…</option>${cand.map(v=>`<option value="${v.id}">${esc(v.name)} · ${esc(v.stage)}</option>`).join('')}</select>
   <label class="f" for="as">Booth setup</label><select class="in" id="as">${SETUPS.map(s=>`<option>${s}</option>`).join('')}</select>
   <div style="height:16px"></div><button class="btn ghost" id="anew" style="width:100%">+ New vendor for ${b}</button>`,
   `<button class="btn accent grow" id="asave">Assign</button>`);
  document.getElementById('anew').onclick=()=>newItem('vendor',{booth:b,setup:as.value});
  document.getElementById('asave').onclick=async()=>{if(!av.value){toast('Choose a vendor');return}
    const it=ITEMS.find(i=>i.id===av.value);await save(it.id,{booth:b,setup:as.value},`Assigned to ${b} (${as.value})`);closeDrawer()};
}

  const counts=Object.fromEntries(STAGES.map(s=>[s,L.filter(i=>i.stage===s).length]));
  if(filt.stage!=='all') L=L.filter(i=>filt.stage==='due'?isDue(i):i.stage===filt.stage);
  if(filt.q){const q=filt.q.toLowerCase();L=L.filter(i=>[i.name,i.category,i.owner,i.contact_name,i.notes,i.booth].join(' ').toLowerCase().includes(q))}
  L.sort((a,b)=>STAGES.indexOf(b.stage)%6-STAGES.indexOf(a.stage)%6||(a.booth||'zz').localeCompare(b.booth||'zz')||a.name.localeCompare(b.name));

  M.innerHTML=`<div class="row" style="margin-bottom:10px"><h2 style="font-family:var(--display);margin:0;flex:1">${title}</h2>${kinds.map(k=>`<button class="btn accent sm" data-new="${k}">+ ${KIND1[k]}</button>`).join('')}</div>
   <input class="search" id="q" placeholder="Search name, contact, owner, notes" value="${esc(filt.q)}">
   <div class="chips"><button class="chip ${filt.stage==='all'?'on':''}" data-s="all">All ${ITEMS.filter(i=>kinds.includes(i.kind)).length}</button><button class="chip ${filt.stage==='due'?'on':''}" data-s="due">Due</button>${STAGES.map(s=>`<button class="chip ${filt.stage===s?'on':''}" data-s="${s}">${s} ${counts[s]}</button>`).join('')}</div>

function card(i){return `<button class="item" data-open="${i.id}"><div class="row"><b class="grow">${esc(i.name)}</b>${pill(i.stage)}</div>

function vUpdates(M){M.innerHTML=`<section class="card"><h2>All updates</h2><p class="sub">Every note and change, newest first.</p>${feed(UPD)}</section>`;bindOpen(M)}

function ckRender(list){const el=document.getElementById('ckl');
  el.innerHTML=list.map((c,n)=>`<div class="ck ${c.d?'done':''}"><input type="checkbox" data-n="${n}" ${c.d?'checked':''} aria-label="${esc(c.t)}"><span>${esc(c.t)}</span><button type="button" data-x="${n}" aria-label="Remove">×</button></div>`).join('')||'<p class="muted small">No checklist items.</p>';
  el.querySelectorAll('input').forEach(c=>c.onchange=()=>{list[c.dataset.n].d=c.checked;ckRender(list)});
  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.x,1);ckRender(list)});}
const FIELDS=['name','category','owner','booth','setup','slot','contact_name','contact_phone','value_kd','paid_kd','next_step','follow_up','files_url','public_desc','instagram','notes'];
function collect(stage,list){const o={stage,checklist:list};FIELDS.forEach(f=>{const e=document.getElementById('f_'+f);if(e){let v=e.value.trim();if(f==='value_kd'||f==='paid_kd')v=v===''?(f==='paid_kd'?0:null):Number(v.replace(/,/g,''));else if(v==='')v=null;o[f]=v}});return o}
function openItem(id,keepScroll){const i=ITEMS.find(x=>x.id===id);if(!i)return;CUR=i;
  const sc=keepScroll?document.querySelector('.drawer .db')?.scrollTop:0;
  const list=JSON.parse(JSON.stringify(i.checklist||[]));let stage=i.stage;
  const ups=UPD.filter(u=>u.item_id===id);
  drawer(i.name,`<div class="small muted">${esc(KIND1[i.kind])}${i.updated_by?` · last changed by ${esc(i.updated_by)} ${fmtT(i.updated_at)}`:''}</div>${form(i)}
   <label class="f" for="unote">Updates</label><div class="row"><input class="in grow" id="unote" placeholder="e.g. Called, waiting for signed contract"><button class="btn sm" id="uadd" type="button">Post</button></div>
   <div style="margin-top:10px">${feed(ups)}</div>
   <div style="height:20px"></div><button class="btn danger sm" id="del" type="button">Delete this ${esc(KIND1[i.kind])}</button>`,
   `<button class="btn accent grow" id="sv">Save changes</button>`);
  if(sc) document.querySelector('.drawer .db').scrollTop=sc;
  ckRender(list);
  document.querySelectorAll('#stg button').forEach(b=>b.onclick=()=>{stage=b.dataset.s;document.querySelectorAll('#stg button').forEach(x=>x.classList.toggle('on',x===b))});
  ckadd.onclick=()=>{const v=cknew.value.trim();if(v){list.push({t:v,d:false});cknew.value='';ckRender(list)}};
  uadd.onclick=async()=>{const v=unote.value.trim();if(!v)return;const {error}=await sb.from('mg_updates').insert({item_id:id,author:ME.name,body:v});if(error)return toast(error.message);unote.value='';toast('Update posted');await loadAll();openItem(id,true)};
  sv.onclick=async()=>{const o=collect(stage,list);if(!o.name)return toast('Name is needed');
    const ch=[];if(o.stage!==i.stage)ch.push(`Stage: ${i.stage} → ${o.stage}`);if((o.booth||null)!==(i.booth||null))ch.push(o.booth?`Booth ${o.booth}`:`Removed from ${i.booth}`);
    const nd=list.filter(c=>c.d&&!(i.checklist||[]).find(x=>x.t===c.t&&x.d)).map(c=>'✓ '+c.t);ch.push(...nd);
    if(await save(id,o,ch.join(' · ')))closeDrawer()};
  del.onclick=async()=>{if(!confirm(`Delete "${i.name}"? This can't be undone.`))return;const {error}=await sb.from('mg_items').delete().eq('id',id);if(error)return toast(error.message);toast('Deleted');closeDrawer();loadAll()};
}
async function save(id,o,note){o.updated_at=new Date().toISOString();o.updated_by=ME.name;
  const {error}=await sb.from('mg_items').update(o).eq('id',id);
  if(error){toast(error.code==='23505'?'That booth is already taken':error.message);return false}
  if(note) await sb.from('mg_updates').insert({item_id:id,author:ME.name,body:note});
  toast('Saved');await loadAll();return true}
function newItem(kind,pre){pre=pre||{};
  const i={kind,name:'',stage:pre.stage||'Lead',checklist:(CL[kind]||[]).map(t=>({t,d:false})),...pre};
  const list=i.checklist;let stage=i.stage;CUR=null;
  drawer(`New ${KIND1[kind]}`,form(i),`<button class="btn accent grow" id="sv">Add ${esc(KIND1[kind])}</button>`);
  ckRender(list);
  document.querySelectorAll('#stg button').forEach(b=>b.onclick=()=>{stage=b.dataset.s;document.querySelectorAll('#stg button').forEach(x=>x.classList.toggle('on',x===b))});
  ckadd.onclick=()=>{const v=cknew.value.trim();if(v){list.push({t:v,d:false});cknew.value='';ckRender(list)}};
  sv.onclick=async()=>{const o=collect(stage,list);if(!o.name)return toast('Name is needed');o.kind=kind;o.updated_by=ME.name;
    const {data,error}=await sb.from('mg_items').insert(o).select().single();
    if(error)return toast(error.code==='23505'?'That booth is already taken':error.message);
    await sb.from('mg_updates').insert({item_id:data.id,author:ME.name,body:`Added as ${o.stage}${o.booth?' in '+o.booth:''}`});
    toast('Added');closeDrawer();await loadAll()};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setPasswordView()});
if(/type=(recovery|invite)/.test(location.hash)) setTimeout(()=>{sb.auth.getSession().then(({data})=>data.session?setPasswordView():start())},300); else start();
</script>
</body>
</html>
