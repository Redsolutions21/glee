<style>
:root{--lime:#C8FF3D;--coral:#5E5E5E;--ink:#4A4A4A;--line:#E7E7E7}
*{box-sizing:border-box}
body{margin:0;background:#F7F7F7;color:var(--ink);font-family:'Cairo','Cairo',sans-serif}
.bar{max-width:1100px;margin:0 auto;padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar h1{font-family:'Cairo',sans-serif;margin:0;flex:1 1 100%;font-size:24px}
.bar input{flex:1;min-width:240px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
.bar button{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.bar button.on{background:var(--ink);color:#fff}
.bar .print{background:var(--coral);border-color:var(--coral);color:#fff}
.note{max-width:1100px;margin:0 auto;padding:0 16px 10px;font-size:13px;color:#6B6B6B}
.sheet{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.qc{background:#fff;border-radius:10px;padding:18px 16px;text-align:center;border:1px solid var(--line);break-inside:avoid;page-break-inside:avoid}
.qc.item{background:var(--lime);border-color:var(--lime)} .qc.session{border:3px solid var(--coral)} .qc.entry,.qc.desk{background:var(--ink);color:#fff}
.qc img.logo{height:30px;display:block;margin:0 auto 8px}
.qc .code{background:#fff;border-radius:14px;padding:10px;display:inline-block}
.qc .code canvas,.qc .code img{display:block;width:170px!important;height:170px!important}
.qc .id{font-family:'Cairo',sans-serif;font-size:28px;font-weight:700;margin-top:8px}
.qc .nm{font-weight:700;font-size:15px;margin-top:2px;min-height:20px}
.qc .ar{font-family:'Cairo',sans-serif;font-size:14px;direction:rtl;min-height:18px}
.qc .cta{margin-top:8px;font-size:12px;font-weight:600}
@media print{.bar,.note{display:none}body{background:#fff}.sheet{grid-template-columns:repeat(3,1fr);gap:8mm;padding:0}.qc{border:1px solid #ccc}@page{size:A4;margin:10mm}}
</style>
</head>

const places=[{id:'ENTRY',kind:'entry',en:'Welcome to glee',ar:'أهلاً بك في glee',cta:'Scan to get your passport',cta_ar:'امسح للحصول على جوازك'},{id:'REG',kind:'desk',en:'Workshop registration',ar:'تسجيل الورش',cta:'Scan to check in',cta_ar:'امسح لتسجيل الحضور'}]
 .concat(C.booths.map(b=>({id:b.id,kind:'booth',en:b.name_en,ar:b.name_ar,cta:'Scan to collect your stamp',cta_ar:'امسح لجمع الختم'})))

 .concat(C.sessions.map(s=>({id:s.id,kind:'session',en:s.title_en,ar:s.title_ar,cta:'Scan at the door to check in',cta_ar:'امسح عند الباب للحضور'})));
let kind='all';
function draw(){
  const base=document.getElementById('base').value.trim().replace(/\/?$/,'/'), sh=document.getElementById('sheet');
  const list=places.filter(p=>kind==='all'||p.kind===kind||(kind==='entry'&&p.kind==='desk'));
  sh.innerHTML=list.map((p,i)=>`<div class="qc ${p.kind}"><img class="logo" alt="glee" src="${p.kind==='entry'||p.kind==='desk'?LOGO_LIME:LOGO_INK}"><div class="code" id="q${i}"></div><div class="id">${esc(p.id)}</div><div class="nm">${esc(p.en)}</div><div class="ar">${esc(p.ar)}</div><div class="cta">${esc(p.cta)}</div><div class="cta ar">${esc(p.cta_ar)}</div></div>`).join('');
  list.forEach((p,i)=>{ if(window.QRCode) new QRCode(document.getElementById('q'+i),{text:base+'?p='+p.id,width:340,height:340,colorDark:'#1A1A1A',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M}); });
}
document.querySelectorAll('.bar button[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll('.bar button[data-k]').forEach(x=>x.classList.toggle('on',x===b));draw()});
document.getElementById('base').onchange=draw;
draw();
</script>
