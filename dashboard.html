<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/glee/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>glee live dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--lime:#C8FF3D;--coral:#5E5E5E;--ink:#4A4A4A;--mute:#7B7B7B;--line:#E7E7E7;--bg:#F7F7F7;--card:#fff;--head:'Cairo',system-ui,sans-serif;--body:'Cairo','Cairo',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
header img{height:38px}
header h1{font-family:var(--head);font-size:24px;margin:0;flex:1}
.live{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.live i{width:9px;height:9px;border-radius:50%;background:#B5B5B5}
.live.on i{background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.lime{background:var(--lime);color:var(--ink)} .btn.coral{background:var(--coral);color:#fff} .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .v{font-family:var(--head);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--mute)}
.kpi.lime{background:var(--lime);border-color:var(--lime)} .kpi.coral{background:var(--coral);border-color:var(--coral);color:#fff} .kpi.coral .l{color:#fff;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-family:var(--head);font-size:18px;margin:0 0 4px}
.card .sub{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:8px 10px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:#F0F0F0;border-radius:999px;overflow:hidden}
.hbar .fill{height:100%;background:var(--ink);border-radius:999px}
.hbar .fill.lime{background:#A6DB1F}.hbar .fill.coral{background:var(--coral)}
.hbar .n{font-variant-numeric:tabular-nums;font-weight:600;min-width:36px;text-align:end}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.seats{display:flex;align-items:center;gap:8px}
.seats .track{flex:1;height:10px;background:#F0F0F0;border-radius:999px;overflow:hidden;min-width:60px}
.seats .fill{height:100%;background:var(--coral)}
.chart svg{width:100%;height:auto;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
.login h1{font-family:var(--head);margin:10px 0 4px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 12px;font-size:16px}
.err{color:#C0002A;font-size:14px}
.winner{background:var(--lime);border-radius:16px;padding:14px;margin-top:10px;font-family:var(--head);font-size:20px}
.muted{color:var(--mute)} .small{font-size:12.5px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
</style>
<style>.btn{border-radius:6px}header img{height:34px}</style></head>

    <div class="card s12"><h2>The Academy</h2><p class="sub">Check-ins at the door against 20 seats · ★ average rating</p>
      <table><thead><tr><th>Session</th><th>Day</th><th>Time</th><th>Type</th><th>Title</th><th>Checked in</th><th class="num">Rating</th></tr></thead><tbody>
      ${C.sessions.filter(s=>day==='all'||s.date===day).map(s=>{const n=sv[s.id]?.size||0;return `<tr><td>${s.id}</td><td>${s.day}</td><td>${s.start}</td><td>${s.type}</td><td>${esc(s.title_en)}</td><td><div class="seats"><span class="track"><span class="fill" style="width:${Math.min(100,n/(s.seats||20)*100)}%;display:block"></span></span><b>${n}/${s.seats||20}</b></div></td><td class="num">${avgR(s.id)||'–'}</td></tr>`}).join('')}</tbody></table></div>
    <div class="card s4"><h2>Area</h2><p class="sub">Registered visitors</p>${dist('area')}</div>
    <div class="card s4"><h2>Age</h2><p class="sub">Registered visitors</p>${dist('age_range')}</div>
    <div class="card s4"><h2>Interests</h2><p class="sub">Chosen at registration</p>${dist('interests')}</div>
    <div class="card s6"><h2>Gender</h2><p class="sub">Optional at registration</p>${dist('gender',{female:'Female',male:'Male',na:'Prefer not to say'})}</div>
    <div class="card s6"><h2>Prize draw</h2><p class="sub">${eligible.length} visitors have ${STAMPS_NEEDED} or more stamps</p>
      <button class="btn coral" id="draw" ${eligible.length?'':'disabled'}>Pick a random winner</button> <button class="btn ghost" id="drawCsv">Download list (CSV)</button><div id="win"></div></div>
  </div>
  <p class="muted small" style="margin-top:14px">Last updated ${new Date().toLocaleTimeString('en-GB',{timeZone:KTZ,hour:'2-digit',minute:'2-digit'})} Kuwait time.</p></div>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{day=b.dataset.d;render()});
  document.getElementById('rf').onclick=load;
  document.getElementById('so').onclick=async()=>{await sb.auth.signOut();loginView()};
  document.getElementById('draw').onclick=()=>{const w=eligible[Math.floor(Math.random()*eligible.length)];document.getElementById('win').innerHTML=`<div class="winner">🎉 ${esc(w.full_name)}<div style="font-family:var(--body);font-size:14px;margin-top:4px">${esc(w.mobile)} · ${stampsBy[w.id].size} stamps</div></div>`};
  document.getElementById('drawCsv').onclick=()=>csv('glee-prize-draw.csv',[['Name','Mobile','Email','Stamps']].concat(eligible.map(v=>[v.full_name,v.mobile,v.email||'',stampsBy[v.id].size])));
  document.getElementById('leads').onclick=()=>{const rows=[['Booth','Brand','Visitor','Mobile','Email','Scanned','Favourite']];const vmap={};D.visitors.forEach(v=>vmap[v.id]=v);
    C.booths.concat(C.items.map(m=>({id:m.id,name_en:m.brand+' · '+m.name_en}))).forEach(b=>{const ids=new Set(D.scans.filter(s=>s.place_id===b.id).map(s=>s.visitor_id).concat(D.favs.filter(f=>f.place_id===b.id).map(f=>f.visitor_id)));
      ids.forEach(id=>{const v=vmap[id];if(!v||!v.consent_share_brands)return;rows.push([b.id,b.name_en,v.full_name,v.mobile,v.email||'',D.scans.some(s=>s.place_id===b.id&&s.visitor_id===id)?'Yes':'No',D.favs.some(f=>f.place_id===b.id&&f.visitor_id===id)?'Yes':'No'])})});
    csv('glee-brand-leads.csv',rows)};
}
function csv(name,rows){const s='﻿'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function start(){
  const {data:{session}}=await sb.auth.getSession(); if(!session){loginView();return}
  const {data:adm}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
  if(!adm){await sb.auth.signOut();loginView('This account is not an organiser account.');return}
  app.innerHTML='<p class="wrap muted">Loading…</p>';
  try{await load()}catch(e){app.innerHTML=`<p class="wrap err">Could not load data: ${esc(e.message)}</p>`;return}
  let pending=null;
  sb.channel('scans-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'scans'},()=>{clearTimeout(pending);pending=setTimeout(load,3000)}).subscribe(st=>{live=st==='SUBSCRIBED';const t=document.getElementById('liveTag');if(t){t.classList.toggle('on',live);t.innerHTML=`<i></i>${live?'Live':'Connecting'}`}});
  clearInterval(timer); timer=setInterval(load,60000);
}
start();
</script>
