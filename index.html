<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/glee/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C6FF3D">
<title>glee passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--lime:#C8FF3D;--coral:#5E5E5E;--gray:#F5F5F5;--white:#FFFFFF;--ink:#4A4A4A;--mute:#7B7B7B;--line:#E7E7E7;--card:#FFFFFF;--bg:#F7F7F7;
--head:'Cairo','Cairo',system-ui,sans-serif;--body:'Cairo','Cairo',system-ui,sans-serif}
[dir=rtl]{--head:'Cairo','Cairo',system-ui,sans-serif;--body:'Cairo','Cairo',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top img{height:34px;display:block}
.pill{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.05}
h2{font-size:24px;line-height:1.15}
h3{font-size:18px}
.muted{color:var(--mute)}
.small{font-size:13px}
.hero{background:var(--lime);border-radius:10px;padding:22px 20px;margin:6px 0 16px;position:relative;overflow:hidden}
.hero h1{max-width:85%}
.hero p{margin:8px 0 0;font-size:15px}
.hero .blob{position:absolute;right:-26px;bottom:-26px;width:110px;height:110px;border-radius:50%;background:var(--coral)}
.hero .blob:after{content:'';position:absolute;left:28px;top:30px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:26px 0 0 #fff}
[dir=rtl] .hero .blob{right:auto;left:-26px}
.card{background:var(--card);border-radius:10px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--gray)}
.tag.lime{background:var(--lime)} .tag.coral{background:var(--coral);color:#fff} .tag.ink{background:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;text-align:start;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-family:var(--head);font-size:19px}
.tile .tag{align-self:flex-start}
.list .item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.av{width:46px;height:46px;border-radius:14px;background:var(--gray);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;flex:none;font-size:14px}
.av.on{background:var(--lime)}
.heart{border:0;background:transparent;font-size:22px;cursor:pointer;padding:6px;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px}
.in:focus{outline:none;border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px;line-height:1.4}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none;margin:0}
.err{color:#C0002A;font-size:14px;margin-top:10px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed #CFCFCF;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:13px;color:#AAA}
.stamp.on{border:0;background:var(--lime);color:var(--ink);transform:rotate(-8deg)}
.stamp.coral.on{background:var(--coral);color:#fff}
.bar{height:12px;border-radius:999px;background:var(--gray);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:999px;transition:width .6s}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:0}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer;padding:4px 0}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:24px;height:24px}
nav.tabs .scan{margin-top:-28px}
nav.tabs .scan span.ring{width:62px;height:62px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,45,85,.35)}
nav.tabs .scan svg{stroke:#fff;width:28px;height:28px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:20;transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:560px;border-radius:10px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
#reader{width:100%;border-radius:18px;overflow:hidden;background:#000;min-height:260px}
.stars{display:flex;gap:6px;font-size:34px}
.stars button{border:0;background:transparent;cursor:pointer;color:#D6D6D6;padding:0}
.stars button.on{color:var(--coral)}
.stampfx{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stampfx div{width:180px;height:180px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--head);font-weight:700;font-size:22px;animation:pop 1.6s ease forwards;box-shadow:0 10px 40px rgba(0,0,0,.2)}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}25%{transform:scale(1.1) rotate(-8deg);opacity:1}40%{transform:scale(1) rotate(-8deg)}85%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-8deg)}}
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.daytabs button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:8px 0;cursor:pointer;font-weight:700}
.daytabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.daytabs small{display:block;font-weight:500;font-size:11px;opacity:.8}
.sess{border-inline-start:5px solid var(--coral)}
.sess.talk{border-inline-start-color:var(--lime)}
.sample{background:#F1FFD6;border-radius:14px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.center{text-align:center}
.spacer{height:10px}
</style>
<style>
.hero{background:#F2F2F2 !important;color:var(--ink) !important;border-radius:10px !important;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url(city.jpg) center/cover;opacity:.16;pointer-events:none}
.hero>*{position:relative}
.hero h1{font-family:'Fraunces',Georgia,serif !important;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.02}
[dir=rtl] .hero h1{font-family:'Cairo',sans-serif !important;text-transform:none}
.hero .blob{display:none}
.tile{border-radius:10px !important}
.btn{border-radius:6px !important;letter-spacing:.02em}
</style></head>

function toast(msg){const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200)}

async function loadMe(){
  if(!sb) return;
  const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;return}
  const {data}=await sb.from('visitors').select('*').eq('id',session.user.id).maybeSingle();
  me=data||null;
  if(me){
    const [a,b,c]=await Promise.all([sb.from('scans').select('place_id,scanned_at').order('scanned_at'),sb.from('favorites').select('place_id'),sb.from('ratings').select('place_id,stars')]);
    scans=a.data||[]; favs=new Set((b.data||[]).map(x=>x.place_id)); ratings={}; (c.data||[]).forEach(r=>ratings[r.place_id]=r.stars);
  }
}
async function recordScan(id){
  if(!byId[id]){toast(t('unknown'));return false}
  const had=scans.some(s=>s.place_id===id);
  let recent={}; try{recent=JSON.parse(localStorage.getItem('glee_recent')||'{}')}catch(e){}
  if(recent[id]&&Date.now()-recent[id]<10*60*1000){ if(had) toast(t('already')); return true }
  const {error}=await sb.from('scans').insert({place_id:id});
  if(error){toast(t('offline'));return false}
  scans.push({place_id:id,scanned_at:new Date().toISOString()});
  recent[id]=Date.now(); try{localStorage.setItem('glee_recent',JSON.stringify(recent))}catch(e){}
  if(id!=='ENTRY'&&id!=='REG'){ if(had) toast(t('already')); else stampFx(id) }
  return true;
}
function stampFx(id){const d=document.createElement('div'); d.className='stampfx'; d.innerHTML=`<div><span style="font-size:15px">${esc(t('stamped'))}</span><span style="font-size:34px">${esc(id)}</span></div>`; document.body.appendChild(d); setTimeout(()=>d.remove(),1700)}
async function toggleFav(id,btn){
  if(!me){go('register');return}
  if(favs.has(id)){favs.delete(id); btn&&(btn.textContent='♡'); toast(t('unsaved')); await sb.from('favorites').delete().eq('place_id',id)}
  else{favs.add(id); btn&&(btn.textContent='♥'); toast(t('saved')); const {error}=await sb.from('favorites').insert({place_id:id}); if(error&&!String(error.code).startsWith('23')) toast(t('offline'))}
}
async function rate(id,stars,comment){
  ratings[id]=stars;
  const {data:{session}}=await sb.auth.getSession();
  const {error}=await sb.from('ratings').upsert({visitor_id:session.user.id,place_id:id,stars,comment:comment||null},{onConflict:'visitor_id,place_id'});
  toast(error?t('offline'):t('thanks'));
}

  const ints=Object.keys(CATS_AR).concat(['Workshops','Talks']);
  view.innerHTML=`<section class="hero" style="background:var(--coral);color:#fff"><h1>${esc(t('regTitle'))}</h1><p>${esc(t('regSub'))}</p></section>
  <form class="card" id="regForm" novalidate>
    <label class="f" for="name">${esc(t('name'))}</label><input class="in" id="name" autocomplete="name" required>
    <label class="f" for="mobile">${esc(t('mobile'))}</label><input class="in" id="mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="+965" required>
    <label class="f" for="email">${esc(t('email'))}</label><input class="in" id="email" type="email" autocomplete="email">
    <label class="f" for="area">${esc(t('area'))}</label>${sel('area',t('areas'),t('chooseOne'))}
    <label class="f" for="age">${esc(t('age'))}</label>${sel('age',t('ages'),t('chooseOne'))}
    <label class="f" for="gender">${esc(t('gender'))}</label><select class="in" id="gender"><option value="">${esc(t('chooseOne'))}</option><option value="female">${esc(t('female'))}</option><option value="male">${esc(t('male'))}</option><option value="na">${esc(t('noSay'))}</option></select>
    <label class="f">${esc(t('interests'))}</label><div class="chips" id="ints" style="flex-wrap:wrap">${ints.map(i=>`<button type="button" class="chip" data-v="${esc(i)}">${esc(lang==='ar'?(CATS_AR[i]||({Workshops:'الورش',Talks:'الجلسات الحوارية'})[i]):i)}</button>`).join('')}</div>
    <label class="check"><input type="checkbox" id="cTerms"><span>${esc(t('cTerms'))}</span></label>
    <label class="check"><input type="checkbox" id="cBrands"><span>${esc(t('cBrands'))}</span></label>
    <label class="check"><input type="checkbox" id="cMarketing"><span>${esc(t('cMarketing'))}</span></label>
    <p class="small"><a href="privacy.html">${esc(t('privacy'))}</a></p><div class="err" id="regErr" hidden></div>
    <div class="spacer"></div><button class="btn ink block" id="regBtn" type="submit">${esc(t('create'))}</button>
  </form>`;
  view.querySelectorAll('#ints .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  $('#regForm').onsubmit=async e=>{
    e.preventDefault(); const err=$('#regErr'); err.hidden=true;
    const name=$('#name').value.trim(), mobile=$('#mobile').value.trim();
    if(!name||mobile.replace(/\D/g,'').length<8){err.textContent=t('needName');err.hidden=false;return}
    if(!$('#cTerms').checked){err.textContent=t('needTerms');err.hidden=false;return}
    const btn=$('#regBtn'); btn.disabled=true; btn.textContent=t('creating');
    try{
      let {data:{session}}=await sb.auth.getSession();
      if(!session){const r=await sb.auth.signInAnonymously(); if(r.error) throw r.error; session=r.data.session}
      const row={id:session.user.id,full_name:name,mobile,email:$('#email').value.trim()||null,area:$('#area').value||null,age_range:$('#age').value||null,gender:$('#gender').value||null,
        interests:[...view.querySelectorAll('#ints .chip.on')].map(c=>c.dataset.v),lang,consent_terms:true,consent_share_brands:$('#cBrands').checked,consent_marketing:$('#cMarketing').checked};
      const {error}=await sb.from('visitors').upsert(row); if(error) throw error;
      await loadMe(); await recordScan('ENTRY');
      if(pendingPlace){const p=pendingPlace; pendingPlace=null; await recordScan(p); go('place',p)} else go('passport');
    }catch(ex){console.error(ex); err.textContent=t('offline')+' ('+(ex.message||ex)+')'; err.hidden=false; btn.disabled=false; btn.textContent=t('create')}
  };
},
edit(arg){
  const cats=[...new Set(C.booths.map(b=>b.cat).filter(Boolean))]; const cur=arg||'all';
  const list=C.booths.filter(b=>cur==='all'||b.cat===cur||(cur==='fav'&&favs.has(b.id)));
  view.innerHTML=`${sampleNote()}<h1 style="margin:6px 0 12px">${esc(t('theEdit'))}</h1>
  <div class="chips"><button class="chip ${cur==='all'?'on':''}" data-c="all">${esc(t('all'))}</button><button class="chip ${cur==='fav'?'on':''}" data-c="fav">♥ ${esc(t('fav'))}</button>${cats.map(c=>`<button class="chip ${cur===c?'on':''}" data-c="${esc(c)}">${esc(lang==='ar'?(CATS_AR[c]||c):c)}</button>`).join('')}</div>
  <div class="card list">${list.length?list.map(b=>`<div class="item" data-id="${b.id}"><span class="av ${scans.some(s=>s.place_id===b.id)?'on':''}">${b.id}</span><div class="grow"><b>${esc(L(b,'name'))}</b><div class="muted small">${esc(lang==='ar'?(CATS_AR[b.cat]||b.cat):b.cat)}${b.offer_en?' · <span style="color:var(--coral);font-weight:700">'+esc(t('offer'))+'</span>':''}</div></div><button class="heart" data-f="${b.id}">${favs.has(b.id)?'♥':'♡'}</button></div>`).join(''):`<p class="muted">${esc(t('noFav'))}</p>`}</div>`;
  view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go('edit',c.dataset.c));
  bindList();
},
masterpiece(){
  view.innerHTML=`${sampleNote()}<section class="hero"><h1>${esc(t('masterpiece'))}</h1><p>${esc(t('masterpieceSub'))}</p><p class="small">${C.items.length} ${esc(t('items'))}</p><span class="blob"></span></section>
  ${C.items.length?'':`<div class="card"><p class="muted">${esc(lang==='ar'?'تفاصيل الطاولة قريباً.':'Table details coming soon.')}</p></div>`}<div class="card list" style="${C.items.length?'':'display:none'}">${C.items.map(m=>`<div class="item" data-id="${m.id}"><span class="av ${scans.some(s=>s.place_id===m.id)?'on':''}">${m.id}</span><div class="grow"><b>${esc(L(m,'name'))}</b><div class="muted small">${esc(t('by'))} ${esc(m.brand)}${m.price?` · ${Number(m.price).toFixed(3)} ${esc(t('kd'))}`:''}</div></div><button class="heart" data-f="${m.id}">${favs.has(m.id)?'♥':'♡'}</button></div>`).join('')}</div>`;
  bindList();
},
academy(arg){
  const d=+(arg||1);
  const days=[1,2,3,4].map(n=>{const s=C.sessions.find(x=>x.day===n); const dt=new Date(s.date+'T00:00:00'); return {n,label:dt.toLocaleDateString(lang==='ar'?'ar-KW':'en-GB',{day:'numeric',month:'short'})}});
  view.innerHTML=`${sampleNote()}<h1 style="margin:6px 0 12px">${esc(t('academy'))}</h1>
  <div class="daytabs">${days.map(x=>`<button class="${x.n===d?'on':''}" data-d="${x.n}">${esc(t('day'))} ${x.n}<small>${esc(x.label)}</small></button>`).join('')}</div>
  ${C.sessions.every(s=>s.tba)?`<div class="card"><p class="muted">${esc(lang==='ar'?'جدول الورش والجلسات يُعلن قريباً.':'The workshop and talk schedule will be announced soon.')}</p></div>`:''}${C.sessions.filter(s=>s.day===d&&!s.tba).map(s=>`<div class="card sess ${s.type==='Talk'?'talk':''}" data-id="${s.id}" style="cursor:pointer">
    <div class="row"><span class="tag ${s.type==='Talk'?'lime':'coral'}">${esc(s.type==='Talk'?t('talk'):t('workshop'))}</span><span class="muted small">${esc(s.start)} – ${esc(s.end)}</span>${scans.some(x=>x.place_id===s.id)?`<span class="tag ink">✓ ${esc(t('checkin'))}</span>`:''}</div>
    <h3 style="margin-top:8px">${esc(L(s,'title'))}</h3><div class="muted small" style="margin-top:4px">${esc(s.speaker)}</div>
    <div class="muted small" style="margin-top:6px">${s.price?`${esc(s.price)} ${esc(t('kd'))} · ${esc(s.seats)} ${esc(t('seats'))}`:esc(t('free'))}</div></div>`).join('')}`;
  view.querySelectorAll('.daytabs button').forEach(b=>b.onclick=()=>go('academy',b.dataset.d));
  view.querySelectorAll('.sess').forEach(c=>c.onclick=()=>go('place',c.dataset.id));
},
place(id){
  const p=byId[id]; if(!p){go('home');return}
  const stamped=scans.some(s=>s.place_id===id);
  const fav=`<button class="btn ghost" id="favBtn">${favs.has(id)?'♥':'♡'} ${esc(t('fav'))}</button>`;
  let body='';
  if(p.kind==='booth'){
    body=`<span class="tag ink">${p.id}</span> <span class="tag">${esc(lang==='ar'?CATS_AR[p.cat]:p.cat)}</span>${stamped?` <span class="tag lime">✓ ${esc(t('stamped'))}</span>`:''}
    <h1 style="margin-top:12px">${esc(L(p,'name'))}</h1><p style="font-size:17px;line-height:1.5">${esc(L(p,'desc'))}</p>
    ${p.offer_en?`<div class="card" style="background:var(--coral);color:#fff;border:0"><div class="small" style="opacity:.85">${esc(t('offer'))}</div><h3>${esc(L(p,'offer'))}</h3></div>`:''}
    <div class="row" style="flex-wrap:wrap">${fav}${p.ig?`<a class="btn ghost" href="https://instagram.com/${esc(String(p.ig).replace('@',''))}">${esc(t('instagram'))}</a>`:''}${p.web?`<a class="btn ghost" href="${esc(p.web)}">${esc(t('website'))}</a>`:''}</div>
    ${stamped?rateBox(id,t('rateBooth')):''}`;
  } else if(p.kind==='item'){
    body=`<span class="tag lime">${esc(t('masterpiece'))}</span> <span class="tag ink">${p.id}</span>${stamped?` <span class="tag lime">✓ ${esc(t('stamped'))}</span>`:''}
    <h1 style="margin-top:12px">${esc(L(p,'name'))}</h1><p class="muted">${esc(t('by'))} ${esc(p.brand)}</p><p style="font-size:17px;line-height:1.5">${esc(L(p,'desc'))}</p>
    ${p.price?`<h2>${Number(p.price).toFixed(3)} ${esc(t('kd'))}</h2><div class="spacer"></div>`:''}
    <div class="row" style="flex-wrap:wrap">${fav}${p.order?`<a class="btn coral" href="${esc(p.order)}">${esc(t('order'))}</a>`:`<button class="btn coral" disabled>${esc(t('order'))}</button>`}</div>`;
  } else if(p.kind==='session'){
    body=`<span class="tag ${p.type==='Talk'?'lime':'coral'}">${esc(p.type==='Talk'?t('talk'):t('workshop'))}</span> <span class="tag">${esc(t('day'))} ${p.day} · ${esc(p.start)} – ${esc(p.end)}</span>${stamped?` <span class="tag ink">✓ ${esc(t('checkin'))}</span>`:''}
    <h1 style="margin-top:12px">${esc(L(p,'title'))}</h1><p class="muted">${esc(p.speaker)} · ${esc(t('room'))}: ${esc(p.room)}</p><p style="font-size:17px;line-height:1.5">${esc(L(p,'desc'))}</p>
    <p><b>${p.price?`${esc(p.price)} ${esc(t('kd'))}`:esc(t('free'))}</b> · ${esc(p.seats)} ${esc(t('seats'))}</p>
    <div class="row" style="flex-wrap:wrap">${fav}${p.price?(p.eventat?`<a class="btn coral" href="${esc(p.eventat)}">${esc(t('book'))}</a>`:`<button class="btn coral" disabled>${esc(t('book'))}</button>`):''}</div>
    ${stamped?rateBox(id,t('rate')):''}`;
  } else {
    body=`<h1>${esc(L(p,'name'))}</h1><p>${esc(t('heroSub'))}</p><button class="btn ink" onclick="go('home')">${esc(t('tabHome'))}</button>`;
  }
  view.innerHTML=`<button class="pill" style="margin:6px 0 14px" onclick="history.back()">← ${esc(t('back'))}</button><div>${body}</div>`;
  const fb=$('#favBtn'); if(fb) fb.onclick=()=>toggleFav(id,null).then(()=>fb.innerHTML=`${favs.has(id)?'♥':'♡'} ${esc(t('fav'))}`);
  const rb=view.querySelector('.stars'); if(rb){let val=ratings[id]||0; const paint=()=>rb.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i<val)); paint();
    rb.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{val=i+1;paint()}); $('#rateSend').onclick=()=>{if(val) rate(id,val,$('#rateComment').value.trim())}}
},
passport(){
  if(!me){go('register');return}
  const n=stampCount(), pct=Math.min(100,n/STAMPS_NEEDED*100);
  const stampedIds=[...new Set(scans.map(s=>s.place_id).filter(id=>byId[id]&&id!=='ENTRY'&&id!=='REG'))];
  const slots=Math.max(STAMPS_NEEDED,stampedIds.length);
  const favList=[...favs].filter(id=>byId[id]);
  view.innerHTML=`<section class="hero"><div class="small">${esc(t('signedAs'))}</div><h1>${esc(me.full_name)}</h1><p>${n>=STAMPS_NEEDED?esc(t('inDraw')):esc(t('stampsOf')(n))}</p><div class="spacer"></div><div class="bar" style="background:#fff"><i style="width:${pct}%"></i></div><span class="blob"></span></section>
  <div class="card"><h3>${esc(t('myStamps'))}</h3><div class="spacer"></div><div class="stamps">${Array.from({length:slots},(_,i)=>{const id=stampedIds[i]; const k=id?byId[id].kind:''; return `<div class="stamp ${id?'on':''} ${k==='session'?'coral':''}">${id?esc(id):i+1}</div>`}).join('')}</div></div>
  <div class="card list"><h3>${esc(t('fav'))}</h3>${favList.length?favList.map(id=>{const p=byId[id];return `<div class="item" data-id="${id}"><span class="av on">${id}</span><div class="grow"><b>${esc(L(p,p.kind==='session'?'title':'name'))}</b></div><span>♥</span></div>`}).join(''):`<p class="muted small">${esc(t('noFav'))}</p>`}</div>`;
  bindList();
},
scan(){openScanner(); go('home')}
};
function rateBox(id,title){return `<div class="card" style="margin-top:16px"><h3>${esc(title)}</h3><div class="stars" style="margin:8px 0">${[1,2,3,4,5].map(()=>'<button type="button">★</button>').join('')}</div><input class="in" id="rateComment" placeholder="${esc(t('comment'))}"><div class="spacer"></div><button class="btn ink" id="rateSend">${esc(t('send'))}</button></div>`}
function bindList(){
  view.querySelectorAll('.item[data-id]').forEach(it=>it.onclick=e=>{if(e.target.closest('.heart'))return; go('place',it.dataset.id)});
  view.querySelectorAll('.heart[data-f]').forEach(h=>h.onclick=()=>toggleFav(h.dataset.f,h));
}

/* ---------- scanner ---------- */
let qr=null;
function idFromText(txt){
  try{const u=new URL(txt); const p=u.searchParams.get('p'); if(p) return p.toUpperCase()}catch(e){}
  const m=String(txt).trim().toUpperCase().match(/^(B\d{2}|M\d{2}|S\d-\d|ENTRY|REG)$/); return m?m[1]:null;
}
function openScanner(){
  const sh=document.createElement('div'); sh.className='sheet'; sh.innerHTML=`<div class="box"><div class="row"><h2 class="grow">${esc(t('scanTitle'))}</h2><button class="pill" id="scClose">${esc(t('close'))}</button></div><p class="muted small">${esc(t('scanHelp'))}</p><div id="reader"></div><p class="err" id="scErr" hidden></p></div>`;
  document.body.appendChild(sh);
  const close=async()=>{try{if(qr){await qr.stop();qr.clear()}}catch(e){} qr=null; sh.remove()};
  sh.onclick=e=>{if(e.target===sh)close()}; $('#scClose').onclick=close;
  if(!window.Html5Qrcode){$('#scErr').textContent=t('camErr');$('#scErr').hidden=false;return}
  qr=new Html5Qrcode('reader');
  qr.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},async txt=>{const id=idFromText(txt); await close(); if(!id){toast(t('unknown'));return} handlePlace(id)},()=>{})
    .catch(()=>{$('#scErr').textContent=t('camErr');$('#scErr').hidden=false});
}
async function handlePlace(id){
  if(!me){pendingPlace=id; go('register'); return}
  await recordScan(id); go('place',id);
}

/* ---------- routing ---------- */
function go(r,arg){const h='#'+r+(arg?'-'+encodeURIComponent(arg):''); if(location.hash===h||decodeURIComponent(location.hash)===decodeURIComponent(h)) render(); else location.hash=h}
function render(){
  const h=(location.hash||'#home').slice(1); const i=h.indexOf('-'); const r=i<0?h:h.slice(0,i); const arg=i<0?null:decodeURIComponent(h.slice(i+1));
  (R[r]||R.home)(arg);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.r===r||(r==='masterpiece'&&b.dataset.r==='edit')));
  window.scrollTo(0,0);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>b.dataset.r==='scan'?openScanner():go(b.dataset.r));
function applyLang(){document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr'; $('#langBtn').textContent=lang==='ar'?'English':'العربية';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t)); try{localStorage.setItem('glee_lang',lang)}catch(e){}}
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar'; applyLang(); render()};
window.addEventListener('hashchange',render);

(async function start(){
  applyLang();
  if(!sb){view.innerHTML=`<p class="err">${esc(t('offline'))}</p>`;return}
  try{await loadMe()}catch(e){console.error(e)}
  const p=new URLSearchParams(location.search).get('p');
  if(p){history.replaceState(null,'',location.pathname+location.hash); const id=p.toUpperCase(); if(byId[id]){ if(me){await recordScan(id); go('place',id)} else {pendingPlace=id; go('register')} return } }
  render();
})();
</script>
</body>
</html>
